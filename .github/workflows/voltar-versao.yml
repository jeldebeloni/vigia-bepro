name: Voltar versão

on:
  workflow_dispatch:
    inputs:
      plataforma:
        description: Qual plataforma
        type: choice
        required: true
        options:
          - Site jeldebeloni.com.br
          - Manychato
          - BeloniStore Termos
          - BeloniStore Seminovos
          - Feed do catálogo Meta
      acao:
        description: O que fazer
        type: choice
        required: true
        options:
          - Voltar para a versão anterior
          - Desfazer a volta (publicar a mais nova)

concurrency:
  group: voltar-versao

jobs:
  voltar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ${{ inputs.acao }} — ${{ inputs.plataforma }}
        run: node voltar-versao.mjs
        env:
          PLATAFORMA: ${{ inputs.plataforma }}
          ACAO: ${{ inputs.acao }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
