name: Vigia

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: Só mandar um e-mail de teste
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir plataformas
        run: node vigia.mjs
        env:
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
          TESTE: ${{ inputs.teste && '1' || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          MANYCHATO_ALERTS_SECRET: ${{ secrets.MANYCHATO_ALERTS_SECRET }}

      - name: Guardar estado
        if: always()
        run: |
          git diff --quiet estado.json && exit 0
          git config user.name 'vigia-bepro'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Atualiza estado do vigia' estado.json
          git pull --rebase --quiet
          git push --quiet
