name: Vigia

# Rodada curta (16/11/2026): confere os 8 pontos uma vez e termina (~1 min).
# Quem acorda o Vigia a cada 15 min é o pg_cron do banco do Manychato, pelo despertador da Vercel
# (processos-br, /api/disparar/vigia). O agendador do GitHub atrasa e pula disparos
# (09 a 16/11: só 26 de 168), por isso o horário abaixo fica só de reserva.
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      teste:
        description: Só mandar um e-mail de teste
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigiar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Conferir as plataformas
        run: |
          git config user.name 'vigia-bepro'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Rodada que falha (aviso não saiu) fica vermelha: o GitHub manda o e-mail de erro dele.
          node vigia.mjs && ok=0 || ok=$?
          if [ "$TESTE" != '1' ] && ! git diff --quiet estado.json; then
            git commit -q -m 'Atualiza estado do vigia' estado.json
            # Sem o estado salvo, a próxima rodada repete avisos: tenta 3 vezes e, se não der, fica vermelha.
            salvo=0
            for tentativa in 1 2 3; do
              git pull --rebase --quiet && git push --quiet && { salvo=1; break; }
              sleep 5
            done
            [ $salvo = 1 ] || { echo '::error::Estado do vigia não foi salvo'; ok=1; }
          fi
          exit $ok
        env:
          GMAIL_USUARIO: ${{ secrets.GMAIL_USUARIO }}
          GMAIL_SENHA_APP: ${{ secrets.GMAIL_SENHA_APP }}
          TESTE: ${{ inputs.teste && '1' || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
          MANYCHATO_ALERTS_SECRET: ${{ secrets.MANYCHATO_ALERTS_SECRET }}
          COMPRAS_ALERTAS_SECRET: ${{ secrets.COMPRAS_ALERTAS_SECRET }}
